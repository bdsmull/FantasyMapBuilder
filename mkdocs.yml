site_name: Fantasy RPG Map Editor
site_description: A web-based editor for fantasy RPG maps, from rooms to whole worlds, linked into navigable world sets. Saves Tiled .tmj maps.

repo_url: https://github.com/bdsmull/FantasyMapBuilder
repo_name: FantasyMapBuilder

# Fail the strict build (mkdocs build --strict) on broken links, including #section anchors
validation:
  anchors: warn
  unrecognized_links: warn

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - World Sets & Scales: world-sets.md
    - Elevation: elevation.md
    - Roads & Rivers: roads-rivers.md
  - Core Concepts:
    - Overview: concepts.md
    - Map Types: map-types.md
    - Tilesets: tilesets.md
    - Layers: layers.md
    - Objects: objects.md
    - Coordinate Systems: coordinates.md
  - File Format: file-format.md
  - World Coordinates: world-coordinates.md
  - Development:
    - Architecture: architecture.md
    - Testing: testing.md
    - Contributing: contributing.md
    - World Sets Design (original): world-sets-design.md
